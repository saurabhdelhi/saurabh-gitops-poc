## Production Helm Values for Argo CD
## Repository: https://argoproj.github.io/argo-helm
## Chart: argo-cd

global:
  domain: argocd.local.dev
  logging:
    format: json
    level: info

# --- Controller (Reconciliation Engine) ---
controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

# --- Dex Server (Federated SSO / SAML) ---
dex:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# --- Redis (State Cache) ---
redis:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

# --- Repo Server (Manifest Rendering & Helm Execution) ---
repoServer:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# --- Argo CD Server (Web UI & REST/gRPC API) ---
server:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Allow insecure HTTP internally when terminating TLS at Ingress / AWS ALB
  extraArgs:
    - --insecure

  # Expose via NodePort or LoadBalancer locally
  service:
    type: NodePort
    nodePortHttp: 30080
    nodePortHttps: 30443

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/ssl-passthrough: "false"
    hosts:
      - argocd.local.dev
    tls:
      - hosts:
          - argocd.local.dev
        secretName: argocd-server-tls

# --- Core Argo CD Config (argocd-cm) ---
configs:
  cm:
    url: "http://localhost:8085" # Update to your company ArgoCD domain or Ingress host
    # Disable admin account password in production once SSO is healthy:
    # admin.enabled: "false"
    timeout.reconciliation: 180s
    application.instanceLabelKey: argocd.argoproj.io/instance
