# Destination cluster configurations
clusters:
  # Cluster 1: Management (in-cluster)
  mgmt:
    server: "https://kubernetes.default.svc"
    name: "in-cluster"
  # Cluster 2: Remote Workload Cluster
  workload:
    server: "https://workload-cluster-control-plane:6443"
    name: "workload-cluster"

# Source Git Repository
spec:
  repoURL: "https://github.com/saurabhdelhi/saurabh-gitops-poc.git"
  targetRevision: HEAD

# Automated sync policy controls
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
