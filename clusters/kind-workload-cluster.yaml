# Cluster 2: Target Workload Cluster (Production Apps)
# Run with: kind create cluster --name workload-cluster --config clusters/kind-workload-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Expose Application Traffic on localhost
      - containerPort: 80
        hostPort: 9080
        protocol: TCP
      - containerPort: 443
        hostPort: 9443
        protocol: TCP
  - role: worker
    labels:
      node.kubernetes.io/role: worker
      topology.kubernetes.io/zone: us-west-2a
  - role: worker
    labels:
      node.kubernetes.io/role: worker
      topology.kubernetes.io/zone: us-west-2b
