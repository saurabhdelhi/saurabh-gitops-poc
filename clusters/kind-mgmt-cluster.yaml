# Cluster 1: Management Cluster (ArgoCD Control Plane)
# Run with: kind create cluster --name mgmt-cluster --config clusters/kind-mgmt-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Expose ArgoCD UI and Ingress Controller on localhost
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    labels:
      node.kubernetes.io/role: worker
      topology.kubernetes.io/zone: us-east-1a
  - role: worker
    labels:
      node.kubernetes.io/role: worker
      topology.kubernetes.io/zone: us-east-1b
